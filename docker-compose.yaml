services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_organizer}
      POSTGRES_USER: ${POSTGRES_USER:-stock_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://stock_app:local-development-password@db:5432/stock_organizer}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-secret-key-change-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      stock-backend:
        aliases:
          - organizer-api
    restart: unless-stopped

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: stock_organizer_test
      POSTGRES_USER: stock_test
      POSTGRES_PASSWORD: stock_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_test -d stock_organizer_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    build:
      context: .
    profiles: ["test"]
    command: ["sh", "-c", "alembic upgrade head && pytest -q"]
    environment:
      DATABASE_URL: postgresql+psycopg://stock_test:stock_test_password@test-db:5432/stock_organizer_test
      JWT_SECRET_KEY: test-secret-key-that-is-long-enough-for-tests
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CHAT_DAILY_LIMIT: 3
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  stock-backend:
    external: true
    name: stock-analysis-backend
